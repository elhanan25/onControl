<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ניהול כספים</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=20260608-layout7">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <script src="/vendor/chart.js/chart.umd.js" defer></script>
    <script src="app.js?v=20260608-layout4" defer></script>
  </head>
  <body>

    <!-- Login screen -->
    <div id="authOverlay" class="auth-overlay">
      <div class="auth-card">
        <div class="auth-brand">
          <span class="brand-mark">₪</span>
          <div>
            <strong>ניהול כספים</strong>
            <span>מעקב אישי</span>
          </div>
        </div>
        <h2 id="authTitle">כניסה לחשבון</h2>
        <form id="authForm" novalidate>
          <label>
            דוא״ל
            <input id="authEmail" type="email" required placeholder="you@example.com" autocomplete="email">
          </label>
          <label>
            סיסמה
            <input id="authPassword" type="password" required placeholder="••••••••" autocomplete="current-password" minlength="6">
          </label>
          <p class="form-message" id="authMessage" role="status"></p>
          <button class="primary-button" type="submit" id="authSubmit">כניסה</button>
        </form>
        <button class="link-button" type="button" id="authToggle">אין לך חשבון? הרשמה</button>
      </div>
    </div>

    <!-- Main app -->
    <div class="app-shell hidden" id="appShell">
      <aside class="sidebar" aria-label="ניווט ראשי">
        <div class="brand">
          <span class="brand-mark">₪</span>
          <div>
            <strong>ניהול כספים</strong>
            <span>מעקב אישי</span>
          </div>
        </div>

        <nav class="side-nav">
          <button class="nav-item active" type="button" data-page="expenses">
            <span class="nav-icon">−</span>
            <span>הוצאות</span>
          </button>
          <button class="nav-item" type="button" data-page="incomes">
            <span class="nav-icon">+</span>
            <span>הכנסות</span>
          </button>
        </nav>

        <div class="sidebar-footer">
          <span id="userEmail" class="user-email"></span>
          <button class="nav-item logout-button" type="button" id="logoutButton">
            <span class="nav-icon">↩</span>
            <span>יציאה</span>
          </button>
        </div>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <div>
            <p class="eyebrow" id="pageEyebrow">תזרים יומי</p>
            <h1 id="pageTitle">מעקב הוצאות</h1>
          </div>
          <div class="date-pill" id="todayLabel"></div>
        </header>

        <section class="summary-grid" aria-label="סיכומים">
          <article class="metric">
            <span id="todayMetricLabel">היום</span>
            <strong id="todayTotal">₪0</strong>
          </article>
          <article class="metric">
            <span id="monthMetricLabel">החודש</span>
            <strong id="monthTotal">₪0</strong>
          </article>
          <article class="metric">
            <span id="allMetricLabel">סה״כ</span>
            <strong id="allTotal">₪0</strong>
          </article>
        </section>

        <section class="workspace">
          <form id="recordForm" class="panel form-panel">
            <input type="hidden" id="recordId">
            <div class="panel-title">
              <h2 id="formTitle">הוצאה חדשה</h2>
              <button class="icon-button hidden" type="button" id="cancelEdit" title="בטל עריכה" aria-label="בטל עריכה">×</button>
            </div>

            <label>
              תאריך
              <input id="date" name="date" type="date" required>
            </label>

            <label>
              סכום
              <input id="amount" name="amount" type="number" min="0.01" step="0.01" placeholder="0.00" required>
            </label>

            <label>
              קטגוריה
              <select id="category" name="category" required></select>
            </label>

            <label>
              תיאור
              <input id="description" name="description" type="text" placeholder="פירוט קצר">
            </label>

            <label>
              אמצעי תשלום / מקור
              <select id="paymentMethod" name="paymentMethod" required></select>
            </label>

            <p class="form-message" id="formMessage" role="status"></p>
            <button class="primary-button" type="submit" id="submitButton">שמור הוצאה</button>
          </form>

          <section class="panel table-panel">
            <div class="panel-title">
              <h2 id="tableTitle">הוצאות אחרונות</h2>
              <div class="panel-title-actions">
                <span id="recordCount"></span>
                <button class="export-button" type="button" id="exportExcel">אקסל ↓</button>
                <button class="export-button" type="button" id="exportPdf">PDF ↓</button>
              </div>
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>תאריך</th>
                    <th>סכום</th>
                    <th>קטגוריה</th>
                    <th>תיאור</th>
                    <th>תשלום / מקור</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody id="recordsBody"></tbody>
              </table>
              <p class="empty-state" id="emptyState">עדיין אין נתונים בעמוד הזה.</p>
            </div>
          </section>

          <div class="charts-column">
            <div class="chart-panel">
              <div class="panel-title">
                <h2 id="categoryChartTitle">לפי קטגוריה</h2>
              </div>
              <canvas id="categoryChart"></canvas>
            </div>
            <div class="chart-panel">
              <div class="panel-title">
                <h2 id="monthlyChartTitle">סיכום חודשי</h2>
              </div>
              <canvas id="monthlyChart"></canvas>
            </div>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
