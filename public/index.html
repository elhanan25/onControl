<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ניהול כספים</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=20260804-ai-assistant">
    <script src="/vendor/chart.js/chart.umd.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" defer></script>
    <script src="app.js?v=20260804-ai-assistant" defer></script>
  </head>
  <body>
    <div class="auth-overlay" id="authOverlay">
      <div class="auth-card">
        <div class="auth-brand">
          <span class="brand-mark">₪</span>
          <div><strong>ניהול כספים</strong><span>מעקב אישי</span></div>
        </div>
        <div id="loginSection">
          <h2>כניסה למערכת</h2>
          <form id="loginForm">
            <label>שם משתמש<input type="text" id="loginUsername" autocomplete="username" required></label>
            <label>סיסמה<span class="password-wrapper"><input type="password" id="loginPassword" autocomplete="current-password" required><button type="button" class="eye-btn" tabindex="-1" aria-label="הצג סיסמה"></button></span></label>
            <p class="form-message" id="loginMessage" role="status"></p>
            <button class="primary-button" type="submit">כניסה</button>
          </form>
          <button class="link-button" type="button" id="showForgotBtn">שכחתי סיסמה</button>
          <button class="link-button" type="button" id="showRegisterBtn">אין לך חשבון? הירשם</button>
        </div>
        <div id="registerSection" class="hidden">
          <h2>הרשמה</h2>
          <form id="registerForm">
            <label>שם משתמש<input type="text" id="regUsername" autocomplete="username" required></label>
            <label>מייל (לשחזור סיסמה)<input type="email" id="regEmail" autocomplete="email"></label>
            <label>סיסמה (לפחות 6 תווים)<span class="password-wrapper"><input type="password" id="regPassword" autocomplete="new-password" required minlength="6"><button type="button" class="eye-btn" tabindex="-1" aria-label="הצג סיסמה"></button></span></label>
            <p class="form-message" id="registerMessage" role="status"></p>
            <button class="primary-button" type="submit">הרשמה</button>
          </form>
          <button class="link-button" type="button" id="showLoginBtn">יש לך חשבון? התחבר</button>
        </div>
        <div id="forgotSection" class="hidden">
          <h2>שחזור סיסמה</h2>
          <form id="forgotForm">
            <label>כתובת מייל<input type="email" id="forgotEmail" autocomplete="email" required></label>
            <p class="form-message" id="forgotMessage" role="status"></p>
            <button class="primary-button" type="submit">שלח קישור</button>
          </form>
          <button class="link-button" type="button" id="showLoginFromForgotBtn">חזרה לכניסה</button>
        </div>
        <div id="resetSection" class="hidden">
          <h2>סיסמה חדשה</h2>
          <form id="resetForm">
            <label>סיסמה חדשה (לפחות 6 תווים)<span class="password-wrapper"><input type="password" id="resetPassword" autocomplete="new-password" required minlength="6"><button type="button" class="eye-btn" tabindex="-1" aria-label="הצג סיסמה"></button></span></label>
            <p class="form-message" id="resetMessage" role="status"></p>
            <button class="primary-button" type="submit">שמור סיסמה</button>
          </form>
        </div>
      </div>
    </div>
    <div class="app-shell hidden">
      <aside class="sidebar" aria-label="ניווט ראשי">
        <div class="brand">
          <span class="brand-mark">₪</span>
          <div>
            <strong>ניהול כספים</strong>
            <span>מעקב אישי</span>
          </div>
        </div>

        <nav class="side-nav">
          <button class="nav-item active" type="button" data-page="expenses">
            <span class="nav-icon">−</span>
            <span>הוצאות</span>
          </button>
          <button class="nav-item" type="button" data-page="incomes">
            <span class="nav-icon">+</span>
            <span>הכנסות</span>
          </button>
        </nav>
        <div class="sidebar-footer">
          <div class="user-info-row">
            <span id="userLabel"></span>
            <button class="link-button-sidebar" id="updateEmailBtn" type="button">מייל</button>
          </div>
          <div id="updateEmailForm" class="hidden">
            <input type="email" id="updateEmailInput" placeholder="המייל שלך" autocomplete="email">
            <p class="form-message" id="updateEmailMsg" role="status"></p>
            <button class="small-button" id="saveEmailBtn" type="button">שמור</button>
          </div>
          <button class="nav-item logout-button" type="button" id="logoutButton">
            <span class="nav-icon">←</span>
            <span>יציאה</span>
          </button>
        </div>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <div>
            <p class="eyebrow" id="pageEyebrow">תזרים יומי</p>
            <h1 id="pageTitle">מעקב הוצאות</h1>
          </div>
          <div class="date-pill" id="todayLabel"></div>
        </header>

        <section class="summary-grid" aria-label="סיכומים">
          <article class="metric">
            <span id="todayMetricLabel">היום</span>
            <strong id="todayTotal">₪0</strong>
          </article>
          <article class="metric">
            <span id="monthMetricLabel">החודש</span>
            <strong id="monthTotal">₪0</strong>
          </article>
          <article class="metric">
            <span id="allMetricLabel">סה״כ</span>
            <strong id="allTotal">₪0</strong>
          </article>
        </section>

        <section class="workspace">
          <form id="recordForm" class="panel form-panel">
            <input type="hidden" id="recordId">
            <div class="panel-title">
              <h2 id="formTitle">הוצאה חדשה</h2>
              <button class="icon-button hidden" type="button" id="cancelEdit" title="בטל עריכה" aria-label="בטל עריכה">×</button>
            </div>

            <label>
              תאריך
              <input id="date" name="date" type="date" required>
            </label>

            <label>
              סכום
              <input id="amount" name="amount" type="number" min="0.01" step="0.01" placeholder="0.00" required>
            </label>

            <label>
              קטגוריה
              <select id="category" name="category" required></select>
            </label>

            <label>
              תיאור
              <input id="description" name="description" type="text" placeholder="פירוט קצר">
            </label>

            <label>
              אמצעי תשלום / מקור
              <select id="paymentMethod" name="paymentMethod" required></select>
            </label>

            <p class="form-message" id="formMessage" role="status"></p>
            <button class="primary-button" type="submit" id="submitButton">שמור הוצאה</button>
          </form>

          <div class="panel import-panel">
            <span class="import-label">יבוא מ-Excel</span>
            <input type="file" id="excelFileInput" accept=".xlsx,.xls,.csv" class="import-file-input">
            <button class="small-button" type="button" id="uploadExcelButton">יבא</button>
            <div id="importProgress" style="display: none;">
              <div class="import-progress-bar">
                <div class="import-progress-fill" id="importProgressFill"></div>
              </div>
              <span id="importProgressText" style="font-size: 0.8rem;">0%</span>
            </div>
            <span id="importMessage" class="import-message"></span>
          </div>

          <div class="content-stack">
            <section class="panel table-panel">
              <div class="panel-title">
                <h2 id="tableTitle">הוצאות אחרונות</h2>
                <div class="table-filters">
                  <input type="text" id="searchFilter" class="search-filter-input" placeholder="חיפוש...">
                  <input type="month" id="monthFilter" class="month-filter-input" title="סנן לפי חודש">
                  <select id="categoryFilter" class="category-filter-select" title="סנן לפי קטגוריה">
                    <option value="">כל הקטגוריות</option>
                  </select>
                  <button class="small-button hidden" id="clearFilter">הכל</button>
                  <span id="recordCount"></span>
                </div>
              </div>
              <div class="table-wrap">
                <table>
                  <thead>
                    <tr>
                      <th>תאריך</th>
                      <th>סכום</th>
                      <th>קטגוריה</th>
                      <th>תיאור</th>
                      <th>תשלום / מקור</th>
                      <th></th>
                    </tr>
                  </thead>
                  <tbody id="recordsBody"></tbody>
                </table>
                <p class="empty-state" id="emptyState">עדיין אין נתונים בעמוד הזה.</p>
              </div>
              <div class="pagination" id="pagination"></div>
            </section>

            <section class="charts">
              <div class="chart-panel">
                <div class="panel-title">
                  <h2 id="categoryChartTitle">לפי קטגוריה</h2>
                </div>
                <canvas id="categoryChart"></canvas>
              </div>
              <div class="chart-panel">
                <div class="panel-title">
                  <h2 id="monthlyChartTitle">סיכום חודשי</h2>
                </div>
                <canvas id="monthlyChart"></canvas>
              </div>
            </section>
          </div>
        </section>
      </main>

      <div id="assistantWidget">
        <button type="button" id="assistantToggle" class="primary-button">עוזר AI</button>
        <div id="assistantPanel" class="hidden">
          <div class="panel-title">
            <h2>עוזר פיננסי</h2>
            <button type="button" class="small-button" id="assistantClose">סגור</button>
          </div>
          <div id="assistantMessages"></div>
          <form id="assistantForm">
            <input type="text" id="assistantInput" placeholder="שאל אותי על ההוצאות שלך..." autocomplete="off">
            <button type="submit" class="small-button">שלח</button>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
